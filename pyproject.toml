[project]
name = "xr"
version = "0.2.0"
description = "xr: Xray Cloud CLI in the style of uip, with the Xray → UiPath Test Manager sync used by the xray-tm-sync skills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "jmespath>=1.0"]

[project.scripts]
xr = "xr.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xr"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
